<!DOCTYPE html>
<html>
<head>
    <title>Clothing Profile</title>
</head>
<body>
    <h1>👕 Clothing Profile</h1>
    <img src="{{ url_for('static', filename='uploads/' ~ season ~ '/' ~ filename) }}" width="300">
    <p><strong>Season:</strong> {{ season.title() }}</p>
    <p><strong>File Name:</strong> {{ filename }}</p>
    <a href="{{ url_for('favorite', season=season, filename=filename) }}">⭐ Add to Favorites</a>
    <br><br>
    <a href="{{ url_for('closet') }}">← Back to Closet</a>
</body>
</html>
