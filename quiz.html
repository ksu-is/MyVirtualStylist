<form method="POST">
  <label>What should we call you? 🪞</label><br>
  <input type="text" name="name" placeholder="e.g. StyleQueen92, DripKing, CozyVibes" required><br>
  <small>✨ Choose a creative name that fits your fashion energy!</small><br><br>

  <label>What’s your overall style tone?</label><br>
  <select name="tone" required>
    <option value="Chill">Chill</option>
    <option value="Bold">Bold</option>
    <option value="Elegant">Elegant</option>
    <option value="Street">Street</option>
  </select><br><br>

  <label>Do you believe in color theory when dressing?</label><br>
  <input type="radio" name="color_theory" value="Yes" required> Yes<br>
  <input type="radio" name="color_theory" value="No" required> No<br><br>

  <button type="submit">Let’s Go!</button>
</form>
